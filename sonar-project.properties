# === Basic Info ===
sonar.projectKey=noteflowapp
sonar.projectName=noteflowapp
sonar.host.url=http://localhost:9000
sonar.token= sqp_541b7a1324b33e378905ccbab05ab6484096cff9
sonar.sourceEncoding=UTF-8

# === Source Folders ===
sonar.sources=frontend/src,backend/src

# === Exclusions ===
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/.next/**

# === Test Folders ===
sonar.tests=frontend/src/_tests_,backend/src/tests
sonar.test.inclusions=frontend/src/_tests_/**/*.test.js,backend/src/tests/**/*.test.js

# === Coverage Report (for both) ===
# Jest (frontend) → coverage/lcov.info
# Mocha/NYC (backend) → backend/coverage/lcov.info
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info
